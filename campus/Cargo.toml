[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/client"]
default-members = ["crates/shared", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
