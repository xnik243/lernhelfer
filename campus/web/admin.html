<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus – Verwaltung</title>
<link rel="stylesheet" href="seite.css?v=__V__-2">
</head>
<body>
<main>
<p><a href="./">← Ins Spiel</a> · <a href="hilfe">Hilfe</a></p>
<h1>Campus – Verwaltung</h1>
<p id="status" role="status"></p>
<p id="takt" class="meta"></p>
<h2>Meldungen</h2><div id="meldungen"></div>
<h2>Auffälliger Handel</h2><div id="auffaellig"></div>
<h2>Grundstücke</h2><div id="grundstuecke"></div>
<h2>Konten</h2><div id="konten"></div>
<h2>Chat stummschalten</h2>
<p>
  <label>Konto-ID <input id="stumm-user" type="number" min="1" inputmode="numeric"></label>
  <label>Minuten (0 = aufheben) <input id="stumm-minuten" type="number" min="0" value="10" inputmode="numeric"></label>
  <button id="stumm-knopf" class="knopf" type="button">Anwenden</button>
</p>
<p id="stumm-status" class="meta" role="status"></p>

<h2>OpenRouter KI-Konfiguration</h2>
<p id="ki-info" class="meta"></p>
<p>
  <label>API-Schlüssel <input id="ki-key" type="password" autocomplete="off" spellcheck="false" placeholder="leer lassen = unverändert"></label>
  <label>Modell <input id="ki-modell" list="ki-modelle" autocomplete="off" spellcheck="false" maxlength="80"></label>
  <datalist id="ki-modelle"></datalist>
  <button id="ki-speichern" class="knopf" type="button">Speichern</button>
  <button id="ki-loeschen" type="button">Schlüssel löschen</button>
</p>
<p>
  <label>Thema <input id="ki-thema" maxlength="60" placeholder="z. B. Bruchrechnung"></label>
  <button id="ki-test" class="knopf" type="button">Test-Frage generieren</button>
</p>
<p id="ki-status" role="status"></p>
<p id="ki-cache" class="meta"></p>

<h2>Events &amp; Welt</h2>
<p>
  <button id="event-knopf" class="knopf" type="button">2× Taler Event an</button>
  <label>Minuten <input id="event-minuten" type="number" min="1" max="1440" value="60" inputmode="numeric"></label>
  <span id="event-info" class="meta"></span>
</p>
<p>
  <label>Wetter <select id="wetter">
    <option value="-1">Automatisch</option><option value="0">Klar</option><option value="1">Sommerregen</option><option value="2">Schneefall</option><option value="3">Kirschblüten</option>
  </select></label>
  <button id="arch-knopf" type="button" aria-pressed="false">Architekten-Modus</button>
</p>
<p id="welt-status" class="meta" role="status"></p>
<h3>Baupläne</h3><div id="bauplaene"></div>
</main>
<script type="module" src="admin.js?v=__V__"></script>
</body>
</html>
